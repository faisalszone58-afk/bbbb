<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYP Championship Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Bellefair&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK, single-file friendly) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #76ABAE;
    --teal: #76ABAE;
    --teal-light: rgba(118,171,174,0.12);
    --teal-border: rgba(118,171,174,0.40);
    --surface: #FFFFFF;
    --surface-2: #F5F5F5;
    --surface-3: #ECEFEF;
    --text-1: #2E4A4D;
    --text-2: #5F7A7C;
    --text-3: #9BB0B1;
    --border: #DDE6E6;
    --red: #C1584A;
    --red-bg: rgba(193,88,74,0.06);
    --red-border: rgba(193,88,74,0.22);
    --green: #4C8C6E;
    --green-bg: rgba(76,140,110,0.08);
    --green-border: rgba(76,140,110,0.25);
    --shadow-sm: 0 1px 3px rgba(46,74,77,0.07), 0 1px 2px rgba(46,74,77,0.05);
    --shadow-md: 0 4px 18px rgba(46,74,77,0.10), 0 2px 6px rgba(46,74,77,0.05);
  }

  html {
    overflow-x: hidden;
    width: 100%;
  }

  body {
    background-color: var(--surface-2);
    background-image: radial-gradient(circle, rgba(118,171,174,0.16) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text-1);
    font-family: 'Bellefair', serif;
    min-height: 100vh;
    overflow-x: hidden;
    width: 100%;
    -webkit-text-size-adjust: 100%;
  }

  .page-wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
    overflow-x: hidden;
    width: 100%;
  }

  @media (max-width: 480px) {
    .page-wrap { padding: 1.25rem 1rem 4rem; }
  }

  /* ── Top bar ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin: -2rem -1.5rem 1.5rem;
    padding: 0.9rem 1.5rem;
    background: rgba(245,245,245,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  @media (max-width: 480px) {
    .top-bar { margin: -1.25rem -1rem 1.25rem; padding: 0.75rem 1rem; }
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'Bellefair', serif;
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .status-pill.viewing .dot { background: var(--teal); }
  .status-pill.admin .dot { background: var(--green); }
  .status-pill.admin { color: var(--green); border-color: var(--green-border); background: var(--green-bg); }

  .admin-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-2);
    font-family: 'Bellefair', serif;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.5rem 1rem;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .admin-btn:hover { border-color: var(--teal-border); color: var(--teal); background: var(--teal-light); }
  .admin-btn.logout:hover { border-color: var(--red-border); color: var(--red); background: var(--red-bg); }

  /* ── Header ── */
  .header-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem; }
  .trophy-icon { font-size: 1.9rem; line-height: 1; flex-shrink: 0; }
  h1.tournament-name {
    font-family: 'Titan One', sans-serif;
    font-size: clamp(1.55rem, 7.2vw, 4.2rem);
    letter-spacing: 0.03em;
    color: var(--accent);
    line-height: 1.05;
    background: linear-gradient(120deg, var(--accent) 35%, #4f8487 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    min-width: 0;
    max-width: 100%;
    overflow-wrap: break-word;
  }
  @media (max-width: 480px) {
    .trophy-icon { font-size: 1.5rem; }
  }
  .subtitle-bar {
    font-family: 'Bellefair', serif;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    color: var(--text-3);
    text-transform: uppercase;
    margin-bottom: 1rem;
    padding-left: 0.1rem;
    overflow-wrap: break-word;
  }
  @media (max-width: 400px) {
    .subtitle-bar { letter-spacing: 0.08em; font-size: 0.62rem; }
  }

  /* ── Quick-jump chips ── */
  .jump-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0.5rem;
    margin-bottom: 2.5rem;
  }
  @media (max-width: 640px) { .jump-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 360px) { .jump-row { grid-template-columns: repeat(2, 1fr); gap: 0.4rem; } }
  .jump-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.5rem 0.4rem;
    cursor: pointer;
    font-family: 'Bellefair', serif;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-2);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s;
    text-decoration: none;
    display: block;
  }
  .jump-chip:hover { border-color: var(--teal-border); color: var(--teal); }

  /* ── Manager section (repeats x6) ── */
  .manager-section {
    margin-bottom: 3rem;
    padding-top: 1rem;
    scroll-margin-top: 5.5rem;
  }
  .manager-section + .manager-section {
    border-top: 1px dashed var(--border);
    padding-top: 3rem;
  }

  .manager-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'Bellefair', serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    background: var(--teal-light);
    border: 1px solid var(--teal-border);
    border-radius: 999px;
    padding: 0.3rem 0.75rem;
    margin-bottom: 0.9rem;
    box-shadow: 0 1px 4px rgba(118,171,174,0.15);
  }

  .manager-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    padding: 0.9rem 1.2rem;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 160%);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .manager-row:focus-within {
    border-color: var(--teal-border);
    box-shadow: 0 0 0 3px var(--teal-light), var(--shadow-sm);
  }
  .manager-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
    white-space: nowrap;
  }
  .manager-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-1);
    font-family: 'Bellefair', serif;
    font-size: 1rem;
    font-weight: 500;
    flex: 1;
    caret-color: var(--teal);
  }
  .manager-input::placeholder { color: var(--text-3); font-weight: 400; }

  /* ── Metrics cards ── */
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.875rem; margin-bottom: 1.5rem; }
  @media (max-width: 520px) { .metrics-grid { grid-template-columns: 1fr; } }
  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.3rem;
    position: relative;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
    min-width: 0;
  }
  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--teal), rgba(118,171,174,0.15));
  }
  .metric-card.remaining-card.danger::before { background: linear-gradient(90deg, var(--red), rgba(193,88,74,0.15)); }
  .metric-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .metric-card.total-card { border-color: var(--teal-border); }
  .metric-card.remaining-card { border-color: var(--teal-border); }
  .metric-card.remaining-card.danger { border-color: var(--red-border) !important; background: var(--red-bg); }
  .metric-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .metric-label .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
  .metric-card.danger .metric-label .dot { background: var(--red); }
  .metric-value {
    font-family: 'Titan One', sans-serif;
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
  }
  .metric-card.danger .metric-value { color: var(--red); }
  .total-input-field {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Titan One', sans-serif;
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    font-weight: 600;
    color: var(--accent);
    width: 100%;
    caret-color: var(--teal);
    -moz-appearance: textfield;
  }
  .total-input-field::-webkit-outer-spin-button,
  .total-input-field::-webkit-inner-spin-button { -webkit-appearance: none; }
  .metric-hint { font-size: 0.66rem; color: var(--text-3); margin-top: 0.35rem; font-family: 'Bellefair', serif; }
  .danger-badge {
    display: none;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--red);
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    border-radius: 4px;
    padding: 2px 7px;
    margin-left: 0.4rem;
  }
  .metric-card.danger .danger-badge { display: inline-block; }

  /* ── Section header ── */
  .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
  .section-title {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-3);
    white-space: nowrap;
  }
  .section-line { flex: 1; height: 1px; background: var(--border); }

  /* ── Player table ── */
  .players-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .table-head {
    display: grid;
    grid-template-columns: 1.8rem 1fr minmax(70px, 96px);
    gap: 0.5rem;
    padding: 0.65rem 1rem;
    background: var(--surface-3);
    border-bottom: 1px solid var(--border);
  }
  .table-head span { font-size: 0.63rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); }
  .table-head span:last-child { text-align: right; }
  .player-row {
    display: grid;
    grid-template-columns: 1.8rem 1fr minmax(70px, 96px);
    gap: 0.5rem;
    align-items: center;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
    min-width: 0;
  }
  .player-row:last-child { border-bottom: none; }
  .player-row:hover, .player-row:focus-within { background: var(--surface-2); }
  .player-num { font-family: 'Bellefair', serif; font-size: 0.75rem; color: var(--text-3); font-weight: 600; }
  .player-name-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-1);
    font-family: 'Bellefair', serif;
    font-size: 0.88rem;
    font-weight: 500;
    width: 100%;
    min-width: 0;
    caret-color: var(--teal);
  }
  .player-name-input::placeholder { color: var(--text-3); font-weight: 400; font-size: 0.82rem; }
  .coin-input-wrap { display: flex; justify-content: flex-end; align-items: center; gap: 0.3rem; min-width: 0; }
  .coin-symbol { font-size: 0.72rem; color: var(--text-3); flex-shrink: 0; }
  .coin-input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
    color: var(--accent);
    font-family: 'Bellefair', serif;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: right;
    padding: 0.32rem 0.5rem;
    width: 100%;
    min-width: 0;
    transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
    caret-color: var(--teal);
  }
  @media (max-width: 400px) {
    .table-head, .player-row { grid-template-columns: 1.4rem 1fr minmax(58px, 74px); gap: 0.35rem; padding-left: 0.75rem; padding-right: 0.75rem; }
    .player-name-input { font-size: 0.82rem; }
    .coin-input { font-size: 0.78rem; padding: 0.3rem 0.4rem; }
  }
  .coin-input::-webkit-outer-spin-button,
  .coin-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .coin-input:focus { border-color: var(--teal-border); background: var(--surface); box-shadow: 0 0 0 3px var(--teal-light); }
  .coin-input::placeholder { color: var(--text-3); font-weight: 400; }

  input:disabled { opacity: 0.85; cursor: default; }
  input:disabled::placeholder { color: transparent; }

  .total-coins-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8rem 1.1rem;
    background: linear-gradient(180deg, var(--surface-3), var(--teal-light));
    border-top: 1px solid var(--teal-border);
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .total-coins-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); }
  .total-coins-value { font-family: 'Bellefair', serif; font-size: 1rem; font-weight: 600; color: var(--accent); }

  .actions-row { display: flex; justify-content: center; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; }
  .action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text-2);
    font-family: 'Bellefair', serif;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 0.55rem 1.3rem;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s, background 0.18s, box-shadow 0.18s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-sm);
  }
  .reset-btn:hover { border-color: var(--red-border); color: var(--red); background: var(--red-bg); box-shadow: none; }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn:disabled:hover { border-color: var(--border); color: var(--text-2); background: var(--surface); }

  .global-actions { display: flex; justify-content: center; margin-top: 1rem; }
  .global-actions .action-btn {
    background: linear-gradient(135deg, var(--teal), #5c9296);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
    padding: 0.75rem 1.9rem;
    font-size: 0.85rem;
    box-shadow: 0 6px 18px rgba(118,171,174,0.35);
  }
  .global-actions .action-btn:hover { box-shadow: 0 8px 22px rgba(118,171,174,0.45); transform: translateY(-1px); }

  .footer {
    text-align: center;
    margin-top: 2rem;
    font-family: 'Bellefair', serif;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--text-3);
    text-transform: uppercase;
  }

  /* ── Login modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,24,0.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 1.5rem; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: 16px; padding: 1.75rem; width: 100%; max-width: 340px; box-shadow: var(--shadow-md); border-top: 3px solid var(--teal); }
  .modal-title { font-family: 'Titan One', sans-serif; font-size: 1.4rem; letter-spacing: 0.02em; color: var(--accent); margin-bottom: 1rem; }
  .modal-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.85rem; font-family: 'Bellefair', serif; font-size: 0.9rem; color: var(--text-1); margin-bottom: 0.7rem; outline: none; }
  .modal-input:focus { border-color: var(--teal-border); box-shadow: 0 0 0 3px var(--teal-light); }
  .modal-error { font-size: 0.76rem; color: var(--red); margin-bottom: 0.6rem; min-height: 1em; }
  .modal-actions { display: flex; gap: 0.6rem; margin-top: 0.4rem; }
  .modal-actions .action-btn { flex: 1; justify-content: center; }

  /* ── Intro celebration animation ── */
  .siuu-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, #2E4A4D 0%, #16292b 75%);
    pointer-events: none;
    animation: siuuFadeOut 0.6s ease 2.4s forwards;
  }
  .siuu-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: scale(0.7);
    opacity: 0;
    animation: siuuStageIn 0.45s cubic-bezier(.2,1.4,.4,1) 0.05s forwards;
  }
  .siuu-figure {
    display: block;
    width: clamp(80px, 18vw, 120px);
    height: auto;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.35));
    transform-origin: bottom center;
    animation: siuuJump 0.9s cubic-bezier(.3,0,.2,1) 0.35s both,
               siuuHoldGlow 1.1s ease-in-out 1.3s 2;
  }
  .siuu-text {
    margin-top: 0.6rem;
    font-family: 'Titan One', sans-serif;
    font-size: clamp(1.8rem, 8vw, 3.2rem);
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 18px rgba(118,171,174,0.9), 0 4px 12px rgba(0,0,0,0.4);
    opacity: 0;
    transform: scale(0.4) rotate(-4deg);
    animation: siuuTextPop 0.55s cubic-bezier(.2,1.6,.3,1) 0.85s forwards;
  }
  .siuu-ring {
    position: absolute;
    top: 42%;
    left: 50%;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid var(--teal);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    animation: siuuRing 0.8s ease-out 0.75s forwards;
  }
  .siuu-spark {
    position: absolute;
    top: 42%;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    opacity: 0;
    animation: siuuSpark 0.7s ease-out 0.8s forwards;
  }

  @keyframes siuuStageIn {
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes siuuJump {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(-22px) scale(1.03); }
    55%  { transform: translateY(-26px) scale(1.05); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes siuuTextPop {
    0%   { opacity: 0; transform: scale(0.4) rotate(-4deg); }
    60%  { opacity: 1; transform: scale(1.12) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes siuuRing {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(7); opacity: 0; }
  }
  @keyframes siuuSpark {
    0%   { transform: translate(-50%, -50%) rotate(var(--a, 0deg)) translateY(0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(var(--a, 0deg)) translateY(-90px) scale(0); opacity: 0; }
  }
  @keyframes siuuFadeOut {
    to { opacity: 0; visibility: hidden; }
  }
  @keyframes siuuHoldGlow {
    0%, 100% { filter: drop-shadow(0 10px 22px rgba(0,0,0,0.35)); }
    50% { filter: drop-shadow(0 10px 26px rgba(118,171,174,0.55)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .siuu-overlay { display: none; }
  }
</style>

    <div class="modal-actions">
      <button class="action-btn" onclick="closeLoginModal()">Cancel</button>

    </div>

<script>
/* ============================================================
   FIREBASE CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDjJ2VeApQLcZZJK0gJIUv9XfCnW_Vj9eU",
  authDomain: "typ-chapm.firebaseapp.com",
  databaseURL: "https://typ-chapm-default-rtdb.firebaseio.com",
  projectId: "typ-chapm",
  storageBucket: "typ-chapm.firebasestorage.app",
  messagingSenderId: "458844107492",
  appId: "1:458844107492:web:78725241c1b5a7c80132f1",
  measurementId: "G-D4N1KH50CE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   Anonymous auth — signs every visitor in silently so writes
   carry a valid Firebase auth token. This fixes "Save failed:
   PERMISSION_DENIED" if the Realtime Database rules require
   auth != null for writes (the PIN below only gates the UI,
   it is not itself a Firebase login).
   ============================================================ */
firebase.auth().signInAnonymously().catch(err => {
  console.error('Anonymous sign-in failed:', err.message);
});

/* ============================================================
   Admin PIN
   ------------------------------------------------------------
   Change this to whatever PIN you want. This is a simple
   client-side gate, not real authentication — anyone who reads
   this file's source can see the PIN, and the Realtime Database
   rules below no longer check identity, only that a write is
   happening. It stops casual visitors from editing, but it is
   NOT secure against someone who inspects the page source.
   ============================================================ */
const ADMIN_PIN = "966066";

/* ============================================================
   Suggested Realtime Database rules (Firebase Console →
   Realtime Database → Rules):

   {
     "rules": {
       "managers": {
         ".read": true,
         ".write": "auth != null"
       }
     }
   }

   This page now signs every visitor in anonymously (see above),
   so ".write": "auth != null" is enough to stop PERMISSION_DENIED
   errors while still blocking raw, unauthenticated script access
   to the database URL. The PIN still gates the UI itself — only
   people who know the PIN see editable fields — but the database
   layer now also requires a valid (anonymous) auth token to write.
   If your current rules already say ".write": true, this change
   still works fine and needs no rule update.
   ============================================================ */

const NUM_PLAYERS = 10;
const MANAGER_KEYS = ['m1','m2','m3','m4','m5','m6'];
let isAdmin = false;
let managersData = {};
let suppressWrite = {};
let saveTimers = {};

function emptyManager() {
  return {
    managerName: '',
    totalPoint: '',
    players: Array.from({length: NUM_PLAYERS}, () => ({name: '', coins: ''}))
  };
}

/* ---------- Build the whole page: 6 stacked sections ---------- */
function buildPage() {
  const jumpRow = document.getElementById('jumpRow');
  const container = document.getElementById('managersContainer');
  jumpRow.innerHTML = '';
  container.innerHTML = '';

  MANAGER_KEYS.forEach((key, idx) => {
    const num = idx + 1;

    const chip = document.createElement('a');
    chip.className = 'jump-chip';
    chip.href = '#section-' + key;
    chip.id = 'chip-' + key;
    chip.textContent = 'Manager ' + num;
    jumpRow.appendChild(chip);

    const section = document.createElement('div');
    section.className = 'manager-section';
    section.id = 'section-' + key;
    section.innerHTML = `
      <span class="manager-tag">Manager ${num}</span>

      <div class="manager-row">
        <span class="manager-label">Name</span>
        <input type="text" id="mname-${key}" class="manager-input" placeholder="Enter manager name..." maxlength="50" autocomplete="off" disabled>
      </div>

      <div class="metrics-grid">
        <div class="metric-card total-card">
          <div class="metric-label"><span class="dot"></span> Total Points</div>
          <input type="number" id="total-${key}" class="total-input-field" placeholder="10000" min="0" disabled>
          <div class="metric-hint" id="totalHint-${key}">tap to edit</div>
        </div>
        <div class="metric-card remaining-card" id="remCard-${key}">
          <div class="metric-label">
            <span class="dot"></span> Remaining Coin
            <span class="danger-badge">⚠ Exceeded</span>
          </div>
          <div class="metric-value" id="remValue-${key}">—</div>
          <div class="metric-hint" id="remHint-${key}">set total to calculate</div>
        </div>
      </div>

      <div class="section-header">
        <span class="section-title">Squad Allocation</span>
        <div class="section-line"></div>
        <span class="section-title">10 Players</span>
      </div>

      <div class="players-table">
        <div class="table-head"><span>#</span><span>Player Name</span><span>Coins</span></div>
        <div id="playersBody-${key}"></div>
        <div class="total-coins-bar">
          <span class="total-coins-label">Total Coins Allocated</span>
          <span class="total-coins-value" id="totalAllocated-${key}">0</span>
        </div>
      </div>

      <div class="actions-row">
        <button class="action-btn reset-btn" id="resetBtn-${key}" onclick="resetManager('${key}')" disabled>↺ &nbsp;Reset Manager ${num}</button>
      </div>
    `;
    container.appendChild(section);

    const body = section.querySelector('#playersBody-' + key);
    for (let i = 0; i < NUM_PLAYERS; i++) {
      const row = document.createElement('div');
      row.className = 'player-row';
      row.innerHTML = `
        <span class="player-num">${String(i+1).padStart(2,'0')}</span>
        <input type="text" id="pname-${key}-${i}" class="player-name-input" placeholder="Player ${i+1}" maxlength="30" autocomplete="off" disabled />
        <div class="coin-input-wrap">
          <span class="coin-symbol">🪙</span>
          <input type="number" id="pcoin-${key}-${i}" class="coin-input" placeholder="0" min="0" disabled />
        </div>
      `;
      body.appendChild(row);
      row.querySelector('.player-name-input').addEventListener('input', () => { recalculate(key); queueSave(key); });
      row.querySelector('.coin-input').addEventListener('input', () => { recalculate(key); queueSave(key); });
    }

    document.getElementById('mname-' + key).addEventListener('input', () => { queueSave(key); updateChipLabel(key); });
    document.getElementById('total-' + key).addEventListener('input', () => { recalculate(key); queueSave(key); });
  });
}

function updateChipLabel(key) {
  const idx = MANAGER_KEYS.indexOf(key);
  const name = document.getElementById('mname-' + key).value;
  document.getElementById('chip-' + key).textContent = name ? name : ('Manager ' + (idx + 1));
}

/* ---------- Load data into a manager's section ---------- */
function loadIntoUI(key, data) {
  suppressWrite[key] = true;
  document.getElementById('mname-' + key).value = data.managerName || '';
  document.getElementById('total-' + key).value = data.totalPoint || '';
  const players = data.players || [];
  for (let i = 0; i < NUM_PLAYERS; i++) {
    const p = players[i] || {};
    document.getElementById('pname-' + key + '-' + i).value = p.name || '';
    document.getElementById('pcoin-' + key + '-' + i).value = p.coins || '';
  }
  updateChipLabel(key);
  recalculate(key);
  suppressWrite[key] = false;
}

function recalculate(key) {
  const totalRaw = parseFloat(document.getElementById('total-' + key).value);
  const total = isNaN(totalRaw) ? null : totalRaw;

  let allocated = 0;
  for (let i = 0; i < NUM_PLAYERS; i++) {
    const v = parseFloat(document.getElementById('pcoin-' + key + '-' + i).value);
    if (!isNaN(v)) allocated += v;
  }
  document.getElementById('totalAllocated-' + key).textContent = allocated.toLocaleString();

  const remCard = document.getElementById('remCard-' + key);
  const remVal = document.getElementById('remValue-' + key);
  const remHint = document.getElementById('remHint-' + key);
  const totalHint = document.getElementById('totalHint-' + key);

  if (total === null) {
    remVal.textContent = '—';
    remHint.textContent = 'set total to calculate';
    totalHint.textContent = 'tap to edit';
    remCard.classList.remove('danger');
    return;
  }

  const remaining = total - allocated;
  remVal.textContent = remaining.toLocaleString();
  remHint.textContent = `${allocated.toLocaleString()} / ${total.toLocaleString()} used`;
  totalHint.textContent = `${remaining.toLocaleString()} remaining`;
  remCard.classList.toggle('danger', remaining < 0);
}

/* ---------- Save (admin only, debounced) ---------- */
function collectManagerData(key) {
  return {
    managerName: document.getElementById('mname-' + key).value,
    totalPoint: document.getElementById('total-' + key).value,
    players: Array.from({length: NUM_PLAYERS}, (_, i) => ({
      name: document.getElementById('pname-' + key + '-' + i).value,
      coins: document.getElementById('pcoin-' + key + '-' + i).value
    }))
  };
}

function queueSave(key) {
  if (suppressWrite[key] || !isAdmin) return;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => {
    const data = collectManagerData(key);
    managersData[key] = data;
    db.ref('managers/' + key).set(data).catch(err => alert('Save failed: ' + err.message));
  }, 250);
}

/* ---------- Firebase realtime listeners ---------- */
function attachListeners() {
  MANAGER_KEYS.forEach(key => {
    db.ref('managers/' + key).on('value', snap => {
      managersData[key] = snap.val() || emptyManager();
      loadIntoUI(key, managersData[key]);
    });
  });
}

/* ---------- Admin auth (PIN-based) ---------- */
function openLoginModal() {
  document.getElementById('loginModal').classList.add('open');
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginPin').value = '';
  document.getElementById('loginPin').focus();
}
function closeLoginModal() { document.getElementById('loginModal').classList.remove('open'); }
function doLogin() {
  const pin = document.getElementById('loginPin').value.trim();
  if (pin === ADMIN_PIN) {
    sessionStorage.setItem('typAdmin', '1');
    closeLoginModal();
    setAdminState(true);
  } else {
    document.getElementById('loginError').textContent = 'Wrong PIN';
  }
}
function doLogout() {
  sessionStorage.removeItem('typAdmin');
  setAdminState(false);
}
document.getElementById('loginPin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function setAllInputsDisabled(disabled) {
  MANAGER_KEYS.forEach(key => {
    const mname = document.getElementById('mname-' + key);
    const total = document.getElementById('total-' + key);
    const resetBtn = document.getElementById('resetBtn-' + key);
    if (!mname || !total || !resetBtn) return; // page not built yet
    mname.disabled = disabled;
    total.disabled = disabled;
    resetBtn.disabled = disabled;
    for (let i = 0; i < NUM_PLAYERS; i++) {
      const pname = document.getElementById('pname-' + key + '-' + i);
      const pcoin = document.getElementById('pcoin-' + key + '-' + i);
      if (pname) pname.disabled = disabled;
      if (pcoin) pcoin.disabled = disabled;
    }
  });
}

function setAdminState(admin) {
  isAdmin = admin;
  const pill = document.getElementById('statusPill');
  const text = document.getElementById('statusText');
  const btn = document.getElementById('adminBtn');

  setAllInputsDisabled(!isAdmin);

  if (isAdmin) {
    pill.className = 'status-pill admin';
    text.textContent = 'Admin Mode';
    btn.textContent = 'Logout';
    btn.classList.add('logout');
    btn.onclick = doLogout;
  } else {
    pill.className = 'status-pill viewing';
    text.textContent = 'View Only';
    btn.textContent = 'Admin Login';
    btn.classList.remove('logout');
    btn.onclick = openLoginModal;
  }
}

/* Admin state is restored after the page is fully built (see Init section below) */

/* ---------- Actions ---------- */
function downloadHTML() {
  const content = document.documentElement.outerHTML;
  const blob = new Blob([content], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'TYP_Championship_Dashboard.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetManager(key) {
  if (!isAdmin) return;
  const idx = MANAGER_KEYS.indexOf(key) + 1;
  if (!confirm('Reset Manager ' + idx + ' data? This cannot be undone.')) return;
  const fresh = emptyManager();
  managersData[key] = fresh;
  db.ref('managers/' + key).set(fresh);
}

/* ---------- Intro celebration cleanup + sound ---------- */
(function(){
  const overlay = document.getElementById('siuuOverlay');
  if (!overlay) return;
  overlay.addEventListener('animationend', (e) => {
    if (e.target === overlay) overlay.remove();
  });
  setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 3200);

  // NOTE: reduced-motion only skips the visual animation (handled in CSS).
  // It must NOT skip the sound — that was muting audio for anyone with
  // "Reduce Motion" turned on (a common battery-saver setting on phones).

  /* Real "Siuuu" clip, embedded as base64 in the <audio id="siuuAudio"> tag above */
  let soundPlaying = false;
  function playSiuuSound() {
    if (soundPlaying) return;
    const audioEl = document.getElementById('siuuAudio');
    if (!audioEl) return;
    audioEl.currentTime = 0;
    audioEl.volume = 0.85;
    const p = audioEl.play();
    if (p && p.then) {
      p.then(() => { soundPlaying = true; })
       .catch(() => { /* autoplay blocked — fallback below will retry on first user gesture */ });
    } else {
      soundPlaying = true;
    }
  }

  playSiuuSound();
  // Almost every browser blocks audio-with-sound autoplay until the user has
  // interacted with the page at least once. Listen for the widest possible
  // set of "first interaction" events and retry there — this reliably
  // unlocks audio on Chrome, Safari (desktop + iOS), Firefox and Edge.
  function fallback() {
    playSiuuSound();
    if (soundPlaying) {
      document.removeEventListener('pointerdown', fallback, true);
      document.removeEventListener('touchstart', fallback, true);
      document.removeEventListener('click', fallback, true);
      document.removeEventListener('keydown', fallback, true);
    }
  }
  document.addEventListener('pointerdown', fallback, true);
  document.addEventListener('touchstart', fallback, true);
  document.addEventListener('click', fallback, true);
  document.addEventListener('keydown', fallback, true);
})();


/* ---------- Init ---------- */
buildPage();
MANAGER_KEYS.forEach(key => loadIntoUI(key, emptyManager()));
attachListeners();
setAdminState(sessionStorage.getItem('typAdmin') === '1');
</script>
