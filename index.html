<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>METRO RUNNER - MURAD VAI CHAMPION SPECIAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Screens */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.95), rgba(48, 43, 99, 0.95), rgba(36, 36, 62, 0.95));
            transition: opacity 0.5s ease;
        }

        .title-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #ff007f, #ffaa00, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
            text-transform: uppercase;
        }

        /* Loading Bar */
        .loading-box {
            width: 280px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border: 2px solid rgba(0, 240, 255, 0.5);
            padding: 2px;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #00f0ff);
            border-radius: 8px;
            transition: width 0.1s linear;
        }

        .loading-text {
            margin-top: 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #00f0ff;
            font-weight: 600;
        }

        /* Buttons */
        .btn {
            padding: 16px 45px;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), 0 5px 0 #500040;
            transform: translateY(0);
            transition: all 0.1s ease;
            text-transform: uppercase;
            outline: none;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5), 0 1px 0 #500040;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 25px;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(10, 10, 25, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #aaa;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.6rem;
            font-weight: 900;
            font-family: monospace;
            color: #fff;
        }

        #score-val { color: #00f0ff; }
        #coins-val { color: #ffaa00; }

        /* Game Over Score Board */
        .stats-board {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 40px;
            margin-bottom: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-row {
            margin: 12px 0;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 900;
            font-family: monospace;
        }

        /* Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 6;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 0 15px;
            pointer-events: none;
        }

        .t-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }

        .t-btn:active {
            background: rgba(0, 240, 255, 0.4);
            border-color: #00f0ff;
            color: #fff;
            transform: scale(0.96);
        }

        #btn-left { grid-column: 1; grid-row: 1 / span 2; }
        #btn-right { grid-column: 3; grid-row: 1 / span 2; }
        #btn-jump { grid-column: 2; grid-row: 1; }
        #btn-slide { grid-column: 2; grid-row: 2; }

        .hidden {
            display: none !important;
        }

        @media (min-width: 900px) {
            #touch-controls {
                opacity: 0.3;
                transition: opacity 0.3s;
            }
            #touch-controls:hover {
                opacity: 1;
            }
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- 3D Canvas -->
        <div id="canvas-container"></div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-card">
                <div>
                    <div class="hud-title">SCORE</div>
                    <div class="hud-value" id="score-val">0</div>
                </div>
            </div>
            <div class="hud-card">
                <div>
                    <div class="hud-title">COINS</div>
                    <div class="hud-value" id="coins-val">0</div>
                </div>
            </div>
        </div>

        <!-- Touch Controls -->
        <div id="touch-controls" class="hidden">
            <div class="t-btn" id="btn-left">LEFT</div>
            <div class="t-btn" id="btn-jump">JUMP</div>
            <div class="t-btn" id="btn-slide">SLIDE</div>
            <div class="t-btn" id="btn-right">RIGHT</div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="overlay-screen">
            <div class="title-container">
                <div class="game-title">METRO RUNNER</div>
                <div class="game-subtitle">MURAD VAI CHAMPION SPECIAL</div>
            </div>
            <div class="loading-box">
                <div class="loading-bar" id="load-bar"></div>
            </div>
            <div class="loading-text" id="load-text">PREPARING TRACKS... 0%</div>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="overlay-screen hidden">
            <div class="title-container">
                <div class="game-title">METRO RUNNER</div>
                <div class="game-subtitle">MURAD VAI CHAMPION SPECIAL</div>
            </div>
            <button class="btn" id="play-btn">PLAY</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-screen hidden">
            <div class="title-container">
                <div class="game-title" style="background: linear-gradient(45deg, #ff0055, #ff5500); -webkit-background-clip: text;">CRASHED!</div>
                <div class="game-subtitle">GAME OVER</div>
            </div>
            <div class="stats-board">
                <div class="stat-row">
                    <div class="stat-label">FINAL SCORE</div>
                    <div class="stat-num" id="final-score" style="color: #00f0ff;">0</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">COINS COLLECTED</div>
                    <div class="stat-num" id="final-coins" style="color: #ffaa00;">0</div>
                </div>
            </div>
            <button class="btn" id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // --- ATTACHED AUDIO ENGINE ---
        class CustomAudioSystem {
            constructor() {
                // Audio File 1: Movement / Jump / Slide Sound ("পানি রে চুত যে")
                this.moveAudio = new Audio('data:audio/mp3;base64,SUQ3BAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//5AwAAAAAAAAAAAAAAAAAAAAAABAAAAAAAACAAACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/++++');
                
                // Audio File 2: Game Over / Crash Sound ("তোমার ছাওয়ায় কত তেল আছে")
                this.crashAudio = new Audio('data:audio/mp3;base64,SUQ3BAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//5AwAAAAAAAAAAAAAAAAAAAAAABAAAAAAAACAAACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/++++');

                // Synthesized Coin Sound via Web Audio API
                this.ctx = null;
                this.initialized = false;
            }

            unlockAudio() {
                if (this.initialized) return;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    // Warm up HTML audio elements for browser autoplay policy compliance
                    this.moveAudio.play().then(() => {
                        this.moveAudio.pause();
                        this.moveAudio.currentTime = 0;
                    }).catch(() => {});
                    
                    this.crashAudio.play().then(() => {
                        this.crashAudio.pause();
                        this.crashAudio.currentTime = 0;
                    }).catch(() => {});

                    this.initialized = true;
                } catch(e) {
                    console.log("Audio unlock error", e);
                }
            }

            playMove() {
                try {
                    this.moveAudio.currentTime = 0;
                    this.moveAudio.play().catch(() => {});
                } catch(e){}
            }

            playCrash() {
                try {
                    this.moveAudio.pause(); // Stop movement sound if playing
                    this.crashAudio.currentTime = 0;
                    this.crashAudio.play().catch(() => {});
                } catch(e){}
            }

            playCoin() {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const audioSys = new CustomAudioSystem();

        // --- CONSTANTS & CONFIG ---
        const LANES = [-3.2, 0, 3.2];
        const INITIAL_SPEED = 28;
        const MAX_SPEED = 65;
        const ACCELERATION = 0.35;
        const JUMP_VELOCITY = 15;
        const GRAVITY = 42;
        const SLIDE_DURATION = 0.7; // seconds

        // Game State
        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let coins = 0;
        let currentSpeed = INITIAL_SPEED;
        let clock = new THREE.Clock();

        // DOM Elements
        const loadBar = document.getElementById('load-bar');
        const loadText = document.getElementById('load-text');
        const loadingScreen = document.getElementById('loading-screen');
        const mainMenu = document.getElementById('main-menu');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const touchControls = document.getElementById('touch-controls');
        const scoreVal = document.getElementById('score-val');
        const coinsVal = document.getElementById('coins-val');
        const finalScore = document.getElementById('final-score');
        const finalCoins = document.getElementById('final-coins');

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a18);
        scene.fog = new THREE.FogExp2(0x0a0a18, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        // Secondary rim/neon light
        const hemiLight = new THREE.HemisphereLight(0x00f0ff, 0xff007f, 0.4);
        scene.add(hemiLight);

        // --- GAME OBJECT CREATION ---
        
        // World Track Pool & Environment
        const trackChunks = [];
        const CHUNK_SIZE = 40;
        const NUM_CHUNKS = 6;
        
        // Materials Library
        const materials = {
            ground: new THREE.MeshStandardMaterial({ color: 0x151522, roughness: 0.8 }),
            rail: new THREE.MeshStandardMaterial({ color: 0x8888aa, metalness: 0.8, roughness: 0.2 }),
            sleeper: new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 }),
            trainBody: new THREE.MeshStandardMaterial({ color: 0xd92338, roughness: 0.3, metalness: 0.3 }),
            trainDark: new THREE.MeshStandardMaterial({ color: 0x11111d, roughness: 0.5 }),
            trainGlass: new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.1, metalness: 0.9 }),
            coin: new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.8, roughness: 0.2, emissive: 0x332200 }),
            obstacle: new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.4 }),
            building: new THREE.MeshStandardMaterial({ color: 0x0d0d1a, roughness: 0.9 }),
            window: new THREE.MeshBasicMaterial({ color: 0xffea78 }),
            playerBody: new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.3 }),
            playerClothes: new THREE.MeshStandardMaterial({ color: 0xff007f, roughness: 0.5 }),
            playerSkin: new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.6 })
        };

        // Player Hierarchy Construction
        class Player {
            constructor() {
                this.group = new THREE.Group();
                
                // Root mesh container for animation transforms
                this.mesh = new THREE.Group();
                this.group.add(this.mesh);

                // Body Parts
                // Torso
                this.torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), materials.playerClothes);
                this.torso.position.y = 1.15;
                this.torso.castShadow = true;
                this.mesh.add(this.torso);

                // Head
                this.head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), materials.playerSkin);
                this.head.position.y = 1.85;
                this.head.castShadow = true;
                this.mesh.add(this.head);

                // Hair/Cap
                const cap = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.15, 0.48), materials.playerBody);
                cap.position.set(0, 2.05, 0);
                this.mesh.add(cap);

                // Left Arm
                this.leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), materials.playerBody);
                this.leftArm.position.set(-0.48, 1.15, 0);
                this.leftArm.geometry.translate(0, -0.25, 0);
                this.leftArm.castShadow = true;
                this.mesh.add(this.leftArm);

                // Right Arm
                this.rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), materials.playerBody);
                this.rightArm.position.set(0.48, 1.15, 0);
                this.rightArm.geometry.translate(0, -0.25, 0);
                this.rightArm.castShadow = true;
                this.mesh.add(this.rightArm);

                // Left Leg
                this.leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.75, 0.24), materials.playerClothes);
                this.leftLeg.position.set(-0.2, 0.7, 0);
                this.leftLeg.geometry.translate(0, -0.3, 0);
                this.leftLeg.castShadow = true;
                this.mesh.add(this.leftLeg);

                // Right Leg
                this.rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.75, 0.24), materials.playerClothes);
                this.rightLeg.position.set(0.2, 0.7, 0);
                this.rightLeg.geometry.translate(0, -0.3, 0);
                this.rightLeg.castShadow = true;
                this.mesh.add(this.rightLeg);

                // Blob Shadow
                const shadowGeo = new THREE.PlaneGeometry(1.2, 1.2);
                const shadowMat = new THREE.MeshBasicMaterial({
                    color: 0x000000,
                    transparent: true,
                    opacity: 0.4,
                    depthWrite: false
                });
                this.shadow = new THREE.Mesh(shadowGeo, shadowMat);
                this.shadow.rotation.x = -Math.PI / 2;
                this.shadow.position.y = 0.02;
                this.group.add(this.shadow);

                scene.add(this.group);

                // Motion & Logic Properties
                this.currentLane = 1; // 0: Left, 1: Center, 2: Right
                this.targetX = LANES[1];
                this.group.position.x = this.targetX;
                
                this.posY = 0;
                this.velocityY = 0;
                this.isGrounded = true;
                
                this.isSliding = false;
                this.slideTimer = 0;

                this.animTimer = 0;
            }

            reset() {
                this.currentLane = 1;
                this.targetX = LANES[1];
                this.group.position.x = this.targetX;
                this.posY = 0;
                this.velocityY = 0;
                this.isGrounded = true;
                this.isSliding = false;
                this.slideTimer = 0;
                this.group.position.y = 0;
                this.mesh.scale.set(1, 1, 1);
                this.mesh.rotation.x = 0;
            }

            moveLeft() {
                if (this.currentLane > 0) {
                    this.currentLane--;
                    this.targetX = LANES[this.currentLane];
                    audioSys.playMove();
                }
            }

            moveRight() {
                if (this.currentLane < 2) {
                    this.currentLane++;
                    this.targetX = LANES[this.currentLane];
                    audioSys.playMove();
                }
            }

            jump() {
                if (this.isGrounded) {
                    this.velocityY = JUMP_VELOCITY;
                    this.isGrounded = false;
                    if (this.isSliding) this.cancelSlide();
                    audioSys.playMove();
                }
            }

            slide() {
                if (!this.isSliding) {
                    this.isSliding = true;
                    this.slideTimer = SLIDE_DURATION;
                    // Fast drop if jumping
                    if (!this.isGrounded) {
                        this.velocityY = -JUMP_VELOCITY * 1.5;
                    }
                    audioSys.playMove();
                }
            }

            cancelSlide() {
                this.isSliding = false;
                this.slideTimer = 0;
                this.mesh.scale.set(1, 1, 1);
            }

            update(delta) {
                // Smooth X Lane Interpolation
                this.group.position.x += (this.targetX - this.group.position.x) * 15 * delta;

                // Vertical / Jump Physics
                if (!this.isGrounded) {
                    this.posY += this.velocityY * delta;
                    this.velocityY -= GRAVITY * delta;

                    if (this.posY <= 0) {
                        this.posY = 0;
                        this.velocityY = 0;
                        this.isGrounded = true;
                    }
                }

                this.group.position.y = this.posY;

                // Slide Logic
                if (this.isSliding) {
                    this.slideTimer -= delta;
                    // Squish mesh down
                    this.mesh.scale.y = THREE.MathUtils.lerp(this.mesh.scale.y, 0.4, 20 * delta);
                    this.mesh.scale.z = THREE.MathUtils.lerp(this.mesh.scale.z, 1.4, 20 * delta);
                    
                    if (this.slideTimer <= 0) {
                        this.cancelSlide();
                    }
                } else {
                    this.mesh.scale.y = THREE.MathUtils.lerp(this.mesh.scale.y, 1.0, 15 * delta);
                    this.mesh.scale.z = THREE.MathUtils.lerp(this.mesh.scale.z, 1.0, 15 * delta);
                }

                // Shadow scaling based on height
                const shadowScale = Math.max(0.2, 1 - (this.posY / 5));
                this.shadow.scale.set(shadowScale, shadowScale, 1);

                // Run Animation Cycles
                if (this.isGrounded && !this.isSliding) {
                    this.animTimer += delta * (currentSpeed * 0.4);
                    const angle = Math.sin(this.animTimer) * 0.7;
                    this.leftLeg.rotation.x = angle;
                    this.rightLeg.rotation.x = -angle;
                    this.leftArm.rotation.x = -angle;
                    this.rightArm.rotation.x = angle;
                } else if (!this.isGrounded) {
                    // Jump pose
                    this.leftLeg.rotation.x = -0.5;
                    this.rightLeg.rotation.x = 0.8;
                    this.leftArm.rotation.x = 0.8;
                    this.rightArm.rotation.x = -0.8;
                } else {
                    // Slide pose legs
                    this.leftLeg.rotation.x = -1.2;
                    this.rightLeg.rotation.x = -1.2;
                }
            }

            get BoundingBox() {
                // Returns simplified hit box
                const width = 0.8;
                const height = this.isSliding ? 0.6 : 1.6;
                const depth = 0.8;
                return new THREE.Box3(
                    new THREE.Vector3(this.group.position.x - width/2, this.group.position.y, this.group.position.z - depth/2),
                    new THREE.Vector3(this.group.position.x + width/2, this.group.position.y + height, this.group.position.z + depth/2)
                );
            }
        }

        const player = new Player();

        // --- TRACK AND OBSTACLE GENERATION ---

        // Object dynamic arrays
        let activeObstacles = [];
        let activeCoins = [];

        function createTrackChunk(zPos) {
            const chunk = new THREE.Group();
            chunk.position.z = zPos;

            // Ground plane
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(16, CHUNK_SIZE), materials.ground);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.01;
            ground.receiveShadow = true;
            chunk.add(ground);

            // Rails & Sleepers for 3 Lanes
            LANES.forEach(x => {
                // Rails
                [-0.8, 0.8].forEach(offset => {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, CHUNK_SIZE), materials.rail);
                    rail.position.set(x + offset, 0.075, 0);
                    chunk.add(rail);
                });

                // Sleepers
                const sleeperCount = 10;
                const spacing = CHUNK_SIZE / sleeperCount;
                for (let i = 0; i < sleeperCount; i++) {
                    const sleeper = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 0.4), materials.sleeper);
                    sleeper.position.set(x, 0.04, -CHUNK_SIZE/2 + i * spacing);
                    chunk.add(sleeper);
                }
            });

            // Decorative Buildings on sides
            for (let side of [-1, 1]) {
                const bHeight = 15 + Math.random() * 25;
                const bWidth = 10;
                const building = new THREE.Mesh(new THREE.BoxGeometry(bWidth, bHeight, CHUNK_SIZE - 2), materials.building);
                building.position.set(side * (12 + bWidth / 2), bHeight / 2, 0);
                chunk.add(building);

                // Simple illuminated window strips
                const winMat = materials.window;
                for (let wy = 3; wy < bHeight - 2; wy += 4) {
                    const windowStrip = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 1.5), winMat);
                    windowStrip.position.set(side * 12 + (side * -0.01), wy, 0);
                    windowStrip.rotation.y = side * -Math.PI / 2;
                    chunk.add(windowStrip);
                }
            }

            scene.add(chunk);
            return chunk;
        }

        // Initialize Procedural Track World
        for (let i = 0; i < NUM_CHUNKS; i++) {
            trackChunks.push(createTrackChunk(-i * CHUNK_SIZE));
        }

        // Spawning Obstacles & Collectibles
        function createTrain(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const length = 18 + Math.random() * 8;
            const height = 3.8;
            const width = 2.6;

            const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, length), materials.trainBody);
            body.position.y = height / 2;
            body.castShadow = true;
            group.add(body);

            // Front Dark windshield
            const front = new THREE.Mesh(new THREE.BoxGeometry(width - 0.2, height * 0.4, 0.2), materials.trainGlass);
            front.position.set(0, height * 0.65, length / 2 + 0.01);
            group.add(front);

            // Side stripe
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(width + 0.05, 0.4, length - 1), materials.trainDark);
            stripe.position.set(0, height * 0.5, 0);
            group.add(stripe);

            group.userData = { 
                type: 'train',
                bounds: new THREE.Vector3(width, height, length)
            };

            scene.add(group);
            activeObstacles.push(group);
        }

        function createBarrier(x, z, canSlideUnder) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            if (canSlideUnder) {
                // High Hurdle (Slide under)
                const topBar = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.6, 0.4), materials.obstacle);
                topBar.position.y = 2.2;
                topBar.castShadow = true;
                group.add(topBar);

                const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.2, 0.2), materials.obstacle);
                leftLeg.position.set(-1.2, 1.1, 0);
                group.add(leftLeg);

                const rightLeg = leftLeg.clone();
                rightLeg.position.x = 1.2;
                group.add(rightLeg);

                group.userData = { type: 'barrier_high', bounds: new THREE.Vector3(2.8, 1.0, 0.6), offsetY: 2.2 };
            } else {
                // Low Barrier (Jump over)
                const bar = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.1, 0.4), materials.obstacle);
                bar.position.y = 0.55;
                bar.castShadow = true;
                group.add(bar);

                group.userData = { type: 'barrier_low', bounds: new THREE.Vector3(2.8, 1.1, 0.4), offsetY: 0.55 };
            }

            scene.add(group);
            activeObstacles.push(group);
        }

        function createCoin(x, y, z) {
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const coin = new THREE.Mesh(geo, materials.coin);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(x, y, z);
            coin.castShadow = true;

            coin.userData = { type: 'coin' };

            scene.add(coin);
            activeCoins.push(coin);
        }

        function spawnPattern(zOffset) {
            // Pick lanes for obstacles
            const laneIndices = [0, 1, 2].sort(() => Math.random() - 0.5);
            const numObstacles = Math.floor(Math.random() * 2) + 1; // 1 or 2 obstacles

            for (let i = 0; i < numObstacles; i++) {
                const lane = laneIndices[i];
                const x = LANES[lane];
                const typeRand = Math.random();

                if (typeRand < 0.5) {
                    createTrain(x, zOffset);
                } else if (typeRand < 0.75) {
                    createBarrier(x, zOffset, false); // Low jump
                } else {
                    createBarrier(x, zOffset, true); // High slide
                }
            }

            // Spawn Coins on free lanes or on top/in front
            const coinLane = laneIndices[numObstacles % 3];
            const coinX = LANES[coinLane];
            const coinPattern = Math.floor(Math.random() * 3);

            for (let c = 0; c < 5; c++) {
                let coinY = 0.8;
                if (coinPattern === 1) coinY = 2.5; // Arc / High
                createCoin(coinX, coinY, zOffset - (c * 2.5));
            }
        }

        // --- GAME LOGIC & LOOPS ---

        let spawnTimer = 0;

        function updateWorld(delta) {
            const moveDist = currentSpeed * delta;

            // Track Chunks Looping
            trackChunks.forEach(chunk => {
                chunk.position.z += moveDist;
                if (chunk.position.z > CHUNK_SIZE) {
                    chunk.position.z -= CHUNK_SIZE * NUM_CHUNKS;
                }
            });

            // Move & Update Obstacles
            for (let i = activeObstacles.length - 1; i >= 0; i--) {
                const obs = activeObstacles[i];
                obs.position.z += moveDist;

                // Collision Detection with Player
                if (Math.abs(obs.position.z - player.group.position.z) < 12) {
                    if (checkCollision(player, obs)) {
                        triggerGameOver();
                        return;
                    }
                }

                // Cleanup old obstacles
                if (obs.position.z > 15) {
                    scene.remove(obs);
                    activeObstacles.splice(i, 1);
                }
            }

            // Move & Update Coins
            for (let i = activeCoins.length - 1; i >= 0; i--) {
                const coin = activeCoins[i];
                coin.position.z += moveDist;
                coin.rotation.z += delta * 4; // Spin effect

                // Pickup Detection
                const distSq = player.group.position.distanceToSquared(coin.position);
                if (distSq < 2.2) {
                    // Picked up
                    coins++;
                    coinsVal.textContent = coins;
                    audioSys.playCoin();
                    scene.remove(coin);
                    activeCoins.splice(i, 1);
                    continue;
                }

                // Cleanup
                if (coin.position.z > 15) {
                    scene.remove(coin);
                    activeCoins.splice(i, 1);
                }
            }

            // Spawning Logic
            spawnTimer += moveDist;
            if (spawnTimer > 35) {
                spawnTimer = 0;
                spawnPattern(-180);
            }

            // Increase Difficulty / Speed over time
            if (currentSpeed < MAX_SPEED) {
                currentSpeed += ACCELERATION * delta;
            }

            // Increase Score based on distance
            score += Math.floor(moveDist);
            scoreVal.textContent = score;
        }

        function checkCollision(playerObj, obs) {
            const pBox = playerObj.BoundingBox;
            const obsPos = obs.position;
            const data = obs.userData;

            if (data.type === 'train') {
                const b = data.bounds;
                const trainBox = new THREE.Box3(
                    new THREE.Vector3(obsPos.x - b.x/2 + 0.2, 0, obsPos.z - b.z/2 + 0.2),
                    new THREE.Vector3(obsPos.x + b.x/2 - 0.2, b.y, obsPos.z + b.z/2 - 0.2)
                );
                return pBox.intersectsBox(trainBox);
            } else if (data.type === 'barrier_low') {
                const b = data.bounds;
                const barBox = new THREE.Box3(
                    new THREE.Vector3(obsPos.x - b.x/2, 0, obsPos.z - b.z/2),
                    new THREE.Vector3(obsPos.x + b.x/2, b.y, obsPos.z + b.z/2)
                );
                return pBox.intersectsBox(barBox);
            } else if (data.type === 'barrier_high') {
                const b = data.bounds;
                const barBox = new THREE.Box3(
                    new THREE.Vector3(obsPos.x - b.x/2, data.offsetY - 0.3, obsPos.z - b.z/2),
                    new THREE.Vector3(obsPos.x + b.x/2, data.offsetY + 0.3, obsPos.z + b.z/2)
                );
                return pBox.intersectsBox(barBox);
            }

            return false;
        }

        // Camera Follow Logic
        function updateCamera(delta) {
            const targetCamX = player.group.position.x * 0.4;
            const targetCamY = 4.2 + (player.posY * 0.3);
            
            camera.position.x += (targetCamX - camera.position.x) * 6 * delta;
            camera.position.y += (targetCamY - camera.position.y) * 6 * delta;
            camera.position.z = 7.0;

            camera.lookAt(player.group.position.x * 0.2, 1.8 + (player.posY * 0.2), -10);
        }

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            if (isPlaying && !isGameOver) {
                player.update(delta);
                updateWorld(delta);
                updateCamera(delta);
            }

            renderer.render(scene, camera);
        }

        // --- CONTROLS & INPUT HANDLERS ---

        function handleLeft() { if (isPlaying && !isGameOver) player.moveLeft(); }
        function handleRight() { if (isPlaying && !isGameOver) player.moveRight(); }
        function handleJump() { if (isPlaying && !isGameOver) player.jump(); }
        function handleSlide() { if (isPlaying && !isGameOver) player.slide(); }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            switch(e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    handleLeft();
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    handleRight();
                    break;
                case 'ArrowUp':
                case 'KeyW':
                case 'Space':
                    handleJump();
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    handleSlide();
                    break;
            }
        });

        // Touch Control Buttons
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); handleLeft(); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); handleRight(); });
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); });
        document.getElementById('btn-slide').addEventListener('touchstart', (e) => { e.preventDefault(); handleSlide(); });

        // Touch Control Fallback Click
        document.getElementById('btn-left').addEventListener('click', handleLeft);
        document.getElementById('btn-right').addEventListener('click', handleRight);
        document.getElementById('btn-jump').addEventListener('click', handleJump);
        document.getElementById('btn-slide').addEventListener('click', handleSlide);

        // Swipe Gestures
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isPlaying || isGameOver) return;
            
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal Swipe
                if (Math.abs(diffX) > 30) {
                    if (diffX > 0) handleRight();
                    else handleLeft();
                }
            } else {
                // Vertical Swipe
                if (Math.abs(diffY) > 30) {
                    if (diffY < 0) handleJump();
                    else handleSlide();
                }
            }
        }, { passive: true });

        // Prevent Default Touch Scroll
        window.addEventListener('touchmove', (e) => {
            if (isPlaying) e.preventDefault();
        }, { passive: false });

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- GAME FLOW MANAGEMENT ---

        function clearWorld() {
            activeObstacles.forEach(obs => scene.remove(obs));
            activeCoins.forEach(coin => scene.remove(coin));
            activeObstacles = [];
            activeCoins = [];
        }

        function startGame() {
            audioSys.unlockAudio();
            
            clearWorld();
            player.reset();
            
            score = 0;
            coins = 0;
            currentSpeed = INITIAL_SPEED;
            spawnTimer = 0;
            scoreVal.textContent = "0";
            coinsVal.textContent = "0";

            isGameOver = false;
            isPlaying = true;

            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            touchControls.classList.remove('hidden');

            clock.start();
        }

        function triggerGameOver() {
            isGameOver = true;
            isPlaying = false;

            audioSys.playCrash();

            finalScore.textContent = score;
            finalCoins.textContent = coins;

            hud.classList.add('hidden');
            touchControls.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        // --- INITIALIZATION & LOADING SIMULATION ---

        document.getElementById('play-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // Fake Loader Simulation
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.floor(Math.random() * 15) + 8;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    mainMenu.classList.remove('hidden');
                }, 400);
            }
            loadBar.style.width = loadProgress + '%';
            loadText.textContent = `PREPARING TRACKS... ${loadProgress}%`;
        }, 120);

        // Start render loop
        animate();

    </script>
</body>
</html>
